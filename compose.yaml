services:
  sec-filings-scraper:
    build: .
    environment:
      SEC_USER_AGENT: ${SEC_USER_AGENT:-}
      SEC_CACHE_DIR: /var/cache/sec-filings-scraper
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - sec-http-cache:/var/cache/sec-filings-scraper
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  sec-http-cache:

