name: CI
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[test]"
      - run: pytest
      - run: python -m pip install pip-audit && pip-audit
      - name: Verify fixtures contain no likely secrets
        shell: bash
        run: '! grep -REi "(api[_-]?key|authorization|bearer|secret)[[:space:]]*[:=][[:space:]]*[^[:space:]]+" src/sec_filings_scraper/fixture_data'

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
